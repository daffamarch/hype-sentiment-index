name: Hype & Sentiment Index Daily Automation

on:
  # Berjalan otomatis setiap pukul 05:00 WIB (22:00 UTC)
  schedule:
    - cron: '0 22 * * *'

  # Tombol manual trigger di tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-distribute-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: 4. Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 edge-tts Pillow

      - name: 5. Ensure Anti-Duplication Cache File Exists
        run: |
          touch posted_links.txt

      - name: 6. Run Anti-AI-Slop Media Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline_media.py

      - name: 7. Upload Generated Media as Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hype-index-media
          path: |
            output_media/*.mp4
            output_media/carousel/*.png
            output_media/latest_analysis.json
          retention-days: 7

      - name: 8. Commit & Push Updated posted_links.txt
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posted_links.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada posted_links.txt"
          else
            git commit -m "chore(cache): update posted_links.txt [skip ci]"
            git push
          fi
