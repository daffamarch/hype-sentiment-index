name: METRIKA Media Multi-Program Automation

on:
  schedule:
    # 1. Edisi Pagi: Pukul 07:00 WIB (00:00 UTC) - Jam Berangkat Kerja & Sarapan
    - cron: '0 0 * * *'
    # 2. Edisi Siang: Pukul 12:30 WIB (05:30 UTC) - Jam Istirahat Makan Siang
    - cron: '30 5 * * *'
    # 3. Edisi Malam: Pukul 19:00 WIB (12:00 UTC) - Prime Time Pulang Kerja & Santai
    - cron: '0 12 * * *'

  # Eksekusi manual via tab "Actions" -> "Run workflow" (Bisa pilih rubrik manual untuk uji coba)
  workflow_dispatch:
    inputs:
      program_override:
        description: 'Pilih program khusus (Kosongkan untuk otomatis sesuai jadwal hari):'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'INDEKS_KERINGAT'
          - 'RADAR_SENTIMEN'
          - 'ANGKA_BICARA'

permissions:
  contents: write

jobs:
  build-and-distribute-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: 4. Install Python Libraries & Headless Chromium (Playwright Engine)
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 Pillow playwright
          playwright install chromium --with-deps

      - name: 5. Ensure Anti-Duplication Cache File Exists
        run: |
          touch posted_links.txt

      - name: 6. Run METRIKA Editorial Pipeline
        env:
          MEDIA_NAME: "METRIKA"
          PROGRAM_OVERRIDE: ${{ github.event.inputs.program_override || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline_media.py

      - name: 7. Upload Generated Media as GitHub Actions Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-metrika-media
          path: |
            output_media/carousel/*.png
            output_media/carousel/*.html
            output_media/latest_analysis.json
          retention-days: 7

      - name: 8. Commit & Push Updated posted_links.txt (Anti-Duplication)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posted_links.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada posted_links.txt"
          else
            git commit -m "chore(cache): update posted_links.txt [skip ci]"
            git push
          fi
